run:
  skills_csv: "select/output_select/selected_skills.csv" # the skills chosen in Step 3
  prompts_csv: "prompt/prompts.csv"
  output_csv: "prompt/output_prompt/responses.csv"
  checkpoint: "prompt/output_prompt/checkpoint.jsonl"
  verbose_log: "prompt/output_prompt/verbose.log"
  id_col: conceptUri # column in the skills CSV that identifies a skill
  max_retries: 3
  default_params:
    temperature: 0.0 # 0 = as deterministic as the model allows
    seed: 42
    # no max_tokens on purpose: the C4 prompts ask for long answers and a cap
    # would silently truncate them (check the finish_reason column instead)

models:
  - name: llama3.1
    litellm_model: ollama_chat/llama3.1:8b
    desc: dense
    supports_schema: false
    enabled: false
    api_base: mygpucluster1

  - name: gemma4
    litellm_model: ollama_chat/gemma4:31b
    supports_schema: false
    desc: dense
    enabled: false
    api_base: mygpucluster1

  - name: mixtral
    litellm_model: ollama_chat/mixtral:8x7b
    supports_schema: false
    desc: moe
    enabled: true
    api_base: mygpucluster1


